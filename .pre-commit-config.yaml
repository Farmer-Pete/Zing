default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.1
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        types: [python]
        pass_filenames: false
      - id: pyleft
        name: pyleft
        entry: uv run pyleft src
        language: system
        pass_filenames: false
        always_run: true
      - id: test
        name: test
        entry: uv run pytest -m "not ui" -x -q
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: test-ui
        name: test-ui
        entry: uv run pytest -m ui -x -q
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
