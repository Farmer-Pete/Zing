[project]
name = "zing-ai"
dynamic = ["version"]
description = "Zing AI development pipeline installer"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "click>=8.1",
]

[project.scripts]
zing-ai = "zing_ai.cli:main"

[build-system]
 requires = ["hatchling", "uv-dynamic-versioning"]
 build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pre-commit>=4.0",
    "ruff>=0.15",
    "pyright>=1.1",
    "pyleft>=1.1",
]

 [tool.hatch.version]
 source = "uv-dynamic-versioning"
 
 [tool.uv-dynamic-versioning]
 vcs = "git"
 style = "pep440"
 fallback-version = "0.0.0"
 
 [tool.hatch.build.targets.wheel]
 packages = ["src/zing_ai"]
 
 [tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]
 

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "W"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"

[tool.pyleft]
paths = ["src"]
