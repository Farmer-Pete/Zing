[project]
name = "zing-ai"
version = "0.1.0"
description = "Zing AI development pipeline installer"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "click>=8.1",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "datastar-py>=0.4",
    "pydantic>=2.0",
    "mcp>=1.26",
    "jinja2",
    "mistune>=3.0",
    "pygments>=2.17",
]

[project.scripts]
zing-ai = "zing_ai.cli:main"

[build-system]
requires = ["uv_build>=0.10.2,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-playwright>=0.6",
    "pre-commit>=4.0",
    "ruff>=0.15",
    "pyright>=1.1",
    "pyleft>=1.1",
    "httpx>=0.28",
]

[tool.setuptools.package-data]
"zing_ai" = ["server/templates/**/*.html"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "W"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
markers = ["ui: browser-based UI tests (require Playwright)"]

[tool.pyleft]
paths = ["src"]
