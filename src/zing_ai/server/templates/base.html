<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Zing Review{% endblock %}</title>
    <link rel="apple-touch-icon" sizes="57x57" href="/static/apple-icon-57x57.png">
    <link rel="apple-touch-icon" sizes="60x60" href="/static/apple-icon-60x60.png">
    <link rel="apple-touch-icon" sizes="72x72" href="/static/apple-icon-72x72.png">
    <link rel="apple-touch-icon" sizes="76x76" href="/static/apple-icon-76x76.png">
    <link rel="apple-touch-icon" sizes="114x114" href="/static/apple-icon-114x114.png">
    <link rel="apple-touch-icon" sizes="120x120" href="/static/apple-icon-120x120.png">
    <link rel="apple-touch-icon" sizes="144x144" href="/static/apple-icon-144x144.png">
    <link rel="apple-touch-icon" sizes="152x152" href="/static/apple-icon-152x152.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-icon-180x180.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/static/android-icon-192x192.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="96x96" href="/static/favicon-96x96.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16x16.png">
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="manifest" href="/static/manifest.json">
    <meta name="msapplication-TileColor" content="#0f1b2d">
    <meta name="msapplication-TileImage" content="/static/ms-icon-144x144.png">
    <meta name="theme-color" content="#0f1b2d">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
    <script type="module" src="https://cdn.jsdelivr.net/gh/starfederation/datastar@1.0.0-RC.8/bundles/datastar.js"></script>
    <script type="module">
        import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
        const s = getComputedStyle(document.documentElement);
        const v = (name) => s.getPropertyValue(name).trim();
        mermaid.initialize({
            startOnLoad: true,
            theme: 'base',
            themeVariables: {
                primaryColor: v('--gray-100'),
                primaryTextColor: v('--navy'),
                primaryBorderColor: v('--navy-mid'),
                lineColor: v('--orange'),
                secondaryColor: v('--gray-100'),
                tertiaryColor: v('--off-white'),
                background: v('--off-white'),
                fontFamily: 'Inter, system-ui, sans-serif',
                fontSize: '14px',
                actorBkg: v('--navy'),
                actorTextColor: '#ffffff',
                actorBorder: v('--navy-mid'),
                signalColor: v('--orange'),
                signalTextColor: v('--text-primary'),
                noteBkgColor: v('--gold'),
                noteTextColor: v('--text-primary'),
                noteBorderColor: v('--amber'),
            },
        });
    </script>
    <link rel="stylesheet" href="/static/css/tokens.css?v={{ asset_version() }}">
    <link rel="stylesheet" href="/static/css/components.css?v={{ asset_version() }}">
    <link rel="stylesheet" href="/static/css/pages.css?v={{ asset_version() }}">
</head>
<body>
    <header class="brand-bar">
        <a href="/dashboard"><img src="/static/zing-logo.svg" alt="Zing"></a>
        <button id="notif-opt-in" class="notif-opt-in-btn" style="display:none;"
                onclick="Notification.requestPermission().then(p => { if (p !== 'default') this.style.display = 'none'; })">
            Enable notifications
        </button>
        <script>
            if ('Notification' in window && Notification.permission === 'default') {
                document.getElementById('notif-opt-in').style.display = 'inline-block';
            }
        </script>
    </header>
    <nav class="top-nav">
        <a href="/dashboard"{% if current_path == "/dashboard" %} class="active"{% endif %}>Sessions</a>
        <a href="/config"{% if current_path == "/config" %} class="active"{% endif %}>Config</a>
        <a href="/install"{% if current_path == "/install" %} class="active"{% endif %}>Install</a>
    </nav>
    <main class="main-content">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
