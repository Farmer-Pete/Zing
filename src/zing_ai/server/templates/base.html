<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Zing Review{% endblock %}</title>
    <script type="module" src="https://cdn.jsdelivr.net/gh/starfederation/datastar@1.0.0-RC.8/bundles/datastar.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, -apple-system, sans-serif; line-height: 1.5; color: #1a1a1a; background: #f5f5f5; padding: 2rem; max-width: 960px; margin: 0 auto; }
        h1 { margin-bottom: 1rem; }
        h2 { margin-bottom: 0.5rem; font-size: 1.25rem; }
        .finding { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 1rem; margin-bottom: 1rem; }
        .finding-header { font-weight: 600; margin-bottom: 0.5rem; }
        .finding-meta { font-size: 0.875rem; color: #666; margin-bottom: 0.5rem; }
        .badge { display: inline-block; padding: 0.125rem 0.5rem; border-radius: 4px; font-size: 0.75rem; font-weight: 600; }
        .badge-high { background: #fee2e2; color: #991b1b; }
        .badge-medium { background: #fef3c7; color: #92400e; }
        .badge-low { background: #d1fae5; color: #065f46; }
        textarea { width: 100%; min-height: 80px; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px; font-family: inherit; resize: vertical; }
        .radio-group { display: flex; flex-direction: column; gap: 0.5rem; margin-top: 0.5rem; }
        .option-label { font-weight: 600; font-size: 0.9375rem; color: #1a1a1a; }
        .option-description { font-size: 0.8125rem; color: #6b7280; margin-top: 0.125rem; line-height: 1.4; }
        .option-card { display: flex; align-items: flex-start; gap: 0.5rem; padding: 0.5rem 0.625rem; border: 1px solid #e5e7eb; border-radius: 6px; cursor: pointer; margin-bottom: 0.375rem; }
        .option-card:hover { border-color: #9ca3af; background: #fafafa; }
        .option-content { display: flex; flex-direction: column; }
        .triage-options { margin-top: 0.75rem; padding: 0.75rem; background: #f9fafb; border-radius: 4px; border: 1px solid #e5e7eb; }
        .triage-options-label { font-size: 0.8rem; color: #6b7280; margin-bottom: 0.5rem; font-weight: 600; }
        .triage-option { padding: 0.375rem 0; margin-bottom: 0.25rem; }
        .action-group { display: flex; gap: 0.5rem; margin-top: 0.5rem; flex-wrap: wrap; }
        .action-btn { padding: 0.375rem 0.75rem; border: 2px solid #ccc; border-radius: 4px; background: #fff; cursor: pointer; font-size: 0.875rem; }
        .action-btn:hover { border-color: #666; }
        .action-btn.selected { border-color: #2563eb; background: #eff6ff; }
        .submit-banner { background: #d1fae5; border: 1px solid #059669; border-radius: 8px; padding: 1rem; margin-top: 1rem; text-align: center; }
        .submit-btn { padding: 0.75rem 2rem; background: #2563eb; color: #fff; border: none; border-radius: 6px; font-size: 1rem; cursor: pointer; margin-top: 0.5rem; }
        .submit-btn:hover { background: #1d4ed8; }
        .session-list { list-style: none; }
        .session-list li { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 1rem; margin-bottom: 0.75rem; }
        .session-list a { color: #2563eb; text-decoration: none; font-weight: 600; }
        .session-list a:hover { text-decoration: underline; }
        .status-badge { display: inline-block; padding: 0.125rem 0.5rem; border-radius: 4px; font-size: 0.75rem; font-weight: 600; }
        .status-pending { background: #fef3c7; color: #92400e; }
        .status-ready { background: #dbeafe; color: #1e40af; }
        .status-completed { background: #d1fae5; color: #065f46; }
        .cleanup-btn { padding: 0.25rem 0.75rem; background: #dc2626; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 0.875rem; }
        code { background: #f0f0f0; padding: 0.125rem 0.25rem; border-radius: 3px; font-size: 0.875rem; }
        pre { background: #f0f0f0; padding: 0.75rem; border-radius: 4px; overflow-x: auto; margin: 0.5rem 0; }
        #findings-container { min-height: 100px; }

        /* Rendered markdown in finding bodies */
        .finding-body { font-size: 0.9375rem; line-height: 1.6; color: #1a1a1a; margin-top: 0.5rem; }
        .finding-body h1 { font-size: 1.25rem; font-weight: 700; margin: 1rem 0 0.5rem; }
        .finding-body h2 { font-size: 1.125rem; font-weight: 600; margin: 0.75rem 0 0.375rem; }
        .finding-body h3 { font-size: 1rem; font-weight: 600; margin: 0.5rem 0 0.25rem; }
        .finding-body p { margin: 0.5rem 0; }
        .finding-body a { color: #2563eb; text-decoration: underline; }

        /* Lists */
        .finding-body ul, .finding-body ol { padding-left: 1.5rem; margin: 0.5rem 0; }
        .finding-body li { margin-bottom: 0.25rem; }

        /* Blockquotes */
        .finding-body blockquote { border-left: 3px solid #d1d5db; padding: 0.25rem 0.75rem; margin: 0.5rem 0; color: #4b5563; background: #f9fafb; border-radius: 0 4px 4px 0; }

        /* Tables */
        .finding-body table { border-collapse: collapse; width: 100%; margin: 0.5rem 0; font-size: 0.875rem; }
        .finding-body th { background: #f3f4f6; font-weight: 600; text-align: left; padding: 0.5rem; border: 1px solid #d1d5db; }
        .finding-body td { padding: 0.5rem; border: 1px solid #e5e7eb; }

        /* Code blocks (Pygments monokai) */
        .finding-body .highlight { background: #272822; padding: 0.75rem; border-radius: 4px; overflow-x: auto; margin: 0.5rem 0; font-size: 0.8125rem; line-height: 1.5; }
        .finding-body .highlight pre { margin: 0; background: none; padding: 0; }
        .finding-body .highlight code { color: #f8f8f2; background: none; padding: 0; font-size: inherit; }

        /* Pygments monokai token colors */
        .highlight .hll { background-color: #49483e }
        .highlight { background: #272822; color: #F8F8F2 }
        .highlight .c { color: #959077 }
        .highlight .err { color: #ED007E; background-color: #1E0010 }
        .highlight .esc { color: #F8F8F2 }
        .highlight .g { color: #F8F8F2 }
        .highlight .k { color: #66D9EF }
        .highlight .l { color: #AE81FF }
        .highlight .n { color: #F8F8F2 }
        .highlight .o { color: #FF4689 }
        .highlight .x { color: #F8F8F2 }
        .highlight .p { color: #F8F8F2 }
        .highlight .ch { color: #959077 }
        .highlight .cm { color: #959077 }
        .highlight .cp { color: #959077 }
        .highlight .cpf { color: #959077 }
        .highlight .c1 { color: #959077 }
        .highlight .cs { color: #959077 }
        .highlight .gd { color: #FF4689 }
        .highlight .ge { color: #F8F8F2; font-style: italic }
        .highlight .ges { color: #F8F8F2; font-weight: bold; font-style: italic }
        .highlight .gr { color: #F8F8F2 }
        .highlight .gh { color: #F8F8F2 }
        .highlight .gi { color: #A6E22E }
        .highlight .go { color: #66D9EF }
        .highlight .gp { color: #FF4689; font-weight: bold }
        .highlight .gs { color: #F8F8F2; font-weight: bold }
        .highlight .gu { color: #959077 }
        .highlight .gt { color: #F8F8F2 }
        .highlight .kc { color: #66D9EF }
        .highlight .kd { color: #66D9EF }
        .highlight .kn { color: #FF4689 }
        .highlight .kp { color: #66D9EF }
        .highlight .kr { color: #66D9EF }
        .highlight .kt { color: #66D9EF }
        .highlight .ld { color: #E6DB74 }
        .highlight .m { color: #AE81FF }
        .highlight .s { color: #E6DB74 }
        .highlight .na { color: #A6E22E }
        .highlight .nb { color: #F8F8F2 }
        .highlight .nc { color: #A6E22E }
        .highlight .no { color: #66D9EF }
        .highlight .nd { color: #A6E22E }
        .highlight .ni { color: #F8F8F2 }
        .highlight .ne { color: #A6E22E }
        .highlight .nf { color: #A6E22E }
        .highlight .nl { color: #F8F8F2 }
        .highlight .nn { color: #F8F8F2 }
        .highlight .nx { color: #A6E22E }
        .highlight .py { color: #F8F8F2 }
        .highlight .nt { color: #FF4689 }
        .highlight .nv { color: #F8F8F2 }
        .highlight .ow { color: #FF4689 }
        .highlight .pm { color: #F8F8F2 }
        .highlight .w { color: #F8F8F2 }
        .highlight .mb { color: #AE81FF }
        .highlight .mf { color: #AE81FF }
        .highlight .mh { color: #AE81FF }
        .highlight .mi { color: #AE81FF }
        .highlight .mo { color: #AE81FF }
        .highlight .sa { color: #E6DB74 }
        .highlight .sb { color: #E6DB74 }
        .highlight .sc { color: #E6DB74 }
        .highlight .dl { color: #E6DB74 }
        .highlight .sd { color: #E6DB74 }
        .highlight .s2 { color: #E6DB74 }
        .highlight .se { color: #AE81FF }
        .highlight .sh { color: #E6DB74 }
        .highlight .si { color: #E6DB74 }
        .highlight .sx { color: #E6DB74 }
        .highlight .sr { color: #E6DB74 }
        .highlight .s1 { color: #E6DB74 }
        .highlight .ss { color: #E6DB74 }
        .highlight .bp { color: #F8F8F2 }
        .highlight .fm { color: #A6E22E }
        .highlight .vc { color: #F8F8F2 }
        .highlight .vg { color: #F8F8F2 }
        .highlight .vi { color: #F8F8F2 }
        .highlight .vm { color: #F8F8F2 }
        .highlight .il { color: #AE81FF }

        /* Inline code override for finding-body */
        .finding-body code { background: #f0f0f0; padding: 0.125rem 0.375rem; border-radius: 3px; font-size: 0.8125rem; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

        /* New severity badges */
        .badge-critical { background: #fca5a5; color: #7f1d1d; }
        .badge-info { background: #e0e7ff; color: #3730a3; }

        /* Evaluation rating badges */
        .badge-strong { background: #d1fae5; color: #065f46; }
        .badge-adequate { background: #dbeafe; color: #1e40af; }
        .badge-weak { background: #fef3c7; color: #92400e; }
        .badge-missing { background: #fee2e2; color: #991b1b; }
        .badge-warn-yes { background: #fee2e2; color: #991b1b; }

        /* Evaluation tables */
        .eval-table { border-collapse: collapse; width: 100%; margin: 0.5rem 0; font-size: 0.875rem; }
        .eval-table th { background: #f3f4f6; font-weight: 600; text-align: left; padding: 0.5rem; border: 1px solid #d1d5db; }
        .eval-table td { padding: 0.5rem; border: 1px solid #e5e7eb; }
        .evaluation-finding { border-left: 3px solid #6366f1; }

        /* Step navigation */
        .step-nav { display: flex; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap; }
        .step-link { padding: 0.5rem 1rem; border: 1px solid #ddd; border-radius: 6px; text-decoration: none; color: #1a1a1a; background: #fff; font-size: 0.875rem; }
        .step-link.active { border-color: #2563eb; background: #eff6ff; }
        .step-link:hover { border-color: #9ca3af; }
    </style>
</head>
<body>
    {% block content %}{% endblock %}
</body>
</html>
