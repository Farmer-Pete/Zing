{% extends "base.html" %}

{% block title %}Command Center{% endblock %}

{% block content %}
<div class="cc-page" data-signals="{_cc: true}" data-init="@get('/command-center/events')">
    <section class="inbox">
        <div class="inbox-header">
            <span class="inbox-title">Needs your input</span>
            <span class="inbox-count">{{ inbox_items|length }}</span>
        </div>
        <div id="inbox-list" class="inbox-list">
            {% include "fragments/inbox_list.html" %}
        </div>
    </section>

    <div class="hubs-header">
        <span>Everything in flight</span>
        <span class="grouped-by">Grouped by team</span>
    </div>

    <div id="hubs-list" class="hubs-list">
        {% include "fragments/hubs_list.html" %}
    </div>
</div>
{% endblock %}
