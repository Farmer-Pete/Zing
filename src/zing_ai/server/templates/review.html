{% extends "base.html" %}

{% block title %}{{ session.title }} — Zing Review{% endblock %}

{% block content %}
<p><a href="/dashboard">&larr; Dashboard</a></p>
<h1>{{ session.title }}</h1>
<p class="finding-meta">Session: {{ session.session_id }} | State: <span class="status-badge status-{{ session.state.value }}">{{ session.state.value }}</span></p>

<div id="review-root"
     data-signals="{responses: {}}"
     data-init="@get('/{{ session.session_id }}/stream')">

    <div id="findings-container">
    </div>

    <div id="review-status">
    </div>

    <div id="submit-section">
    </div>
</div>
{% endblock %}
