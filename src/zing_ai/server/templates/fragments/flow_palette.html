<div data-show="$paletteOpen" class="flow-palette-scrim"
     data-on:click="$paletteOpen = false">
  <div class="flow-palette" onclick="event.stopPropagation()">
    <input class="flow-palette-search"
           data-bind="paletteQuery"
           placeholder="Switch to attention item…"
           autofocus>
    <div class="flow-palette-list">
      {% for item in queue %}
        <div class="flow-palette-row"
             data-show='window.flowPaletteMatch($paletteQuery, {{ ((item.title or "") ~ " " ~ (item.ticket_id or ""))|tojson }})'
             data-on:click="$paletteOpen = false; @post('/command-center/flow/select', {payload: {session_id: '{{ item.session_id|escape }}', step_id: '{{ item.step_id or '' }}'}})">
          <span class="flow-palette-icon">
            {% if item.action_type == 'attach' %}⌨{% elif item.action_type == 'questions' %}?{% else %}●{% endif %}
          </span>
          {% if item.ticket_id %}<span class="flow-palette-ticket">{{ item.ticket_id }}</span>{% endif %}
          <span class="flow-palette-title">{{ item.title }}</span>
          <span class="flow-palette-type-chip">{{ item.action_type }}</span>
        </div>
      {% endfor %}
    </div>
    <div class="flow-palette-footer">↑↓ Navigate · Enter Open · Esc Close</div>
  </div>
</div>
