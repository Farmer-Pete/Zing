{% if step.logs %}
<details id="log-viewer">
    <summary>Build logs ({{ step.logs | length }} entries)</summary>
    <pre class="log-output">{% for entry in step.logs %}[{{ entry.timestamp.strftime('%H:%M:%S') }}] {{ entry.agent_name }}: {{ entry.message }}
{% endfor %}</pre>
</details>
{% endif %}
