<a class="inbox-item" href="{{ item.target_url }}">
    <span class="inbox-priority priority-{{ item.priority }}"></span>
    <span class="inbox-action">
        {{ item.action_text }}
        {% if item.detail_text %}<div class="inbox-detail">{{ item.detail_text }}</div>{% endif %}
    </span>
    <span class="inbox-context">
        {% if item.hub_label %}<span class="ticket">{{ item.hub_label }}</span>{% endif %}
    </span>
    <span class="inbox-time">{{ item.time_waiting }}</span>
    <span class="inbox-arrow">›</span>
</a>
