name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GOLANGCI_LINT_VERSION: v2.13.2 # keep in step with what `brew install golangci-lint` gives locally
  GOVULNCHECK_VERSION: v1.8.0 # keep in step with what `brew install govulncheck` gives locally

# Actions are pinned to commit SHAs so a moved tag cannot change what runs here.
# The tag each SHA was taken from is in the trailing comment; bump both together.
jobs:
  checks:
    name: Hooks and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false # nothing in this job pushes, so keep the token out of .git/config
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Install golangci-lint
        run: curl -sSfL https://golangci-lint.run/install.sh | sh -s -- -b "$(go env GOPATH)/bin" "$GOLANGCI_LINT_VERSION"
      - name: Install govulncheck
        run: go install "golang.org/x/vuln/cmd/govulncheck@$GOVULNCHECK_VERSION"
      # Runs the same Makefile targets as the pre-commit and pre-push hooks, plus vet.
      - name: Pre-commit checks, vet, and tests
        run: make ci

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Read is enough to scan PR commits. The action can also post a PR comment when it
      # finds a leak, but that needs pull-requests: write. A failing check is the intended
      # signal here, so the token stays read-only.
      pull-requests: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0 # gitleaks scans full history
          persist-credentials: false # the scan only reads the checkout
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # required by the action for pull_request events
